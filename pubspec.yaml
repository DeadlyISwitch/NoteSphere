name: notesphere
description: A place where your notes persevere.
version: 0.1.1+2
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0
  sqflite: ^2.2.8+4
  path_provider: ^2.0.15
  path: ^1.8.3
  uuid: 4.5.2
  meta: ^1.9.0
  google_sign_in: ^6.2.0
  googleapis: ^12.0.0
  google_drive_api: ^0.2.0
  http: ^1.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
